name: Nexora QA license and activation
on:
  push:
    branches: [feature/nexora-qa-license-20261128]
  pull_request:
    branches: [fix/consolidation-v1.0.57-20261127]
permissions:
  contents: read
jobs:
  qa-license:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check functions/api/_middleware.js && node --check functions/api/app/activate.js && node --check functions/activar.js && node --check functions/activar-script.js
      - run: node --test deploy/cloudflare/nexora-qa-entitlement.test.mjs deploy/cloudflare/nexora-qa-activation.test.mjs
