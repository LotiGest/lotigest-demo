#lgUpdateNotice{position:fixed;right:max(18px,env(safe-area-inset-right));bottom:max(20px,env(safe-area-inset-bottom));z-index:2147483000;width:min(385px,calc(100vw - 32px));padding:15px 16px;border-radius:20px;border:1px solid rgba(241,255,243,.38);background:linear-gradient(145deg,rgba(242,255,245,.94),rgba(231,247,234,.90));color:#183b27;box-shadow:0 18px 46px rgba(0,30,15,.25),inset 0 1px rgba(255,255,255,.85);backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);animation:lgUpdateArrive .28s ease-out both}
#lgUpdateNotice[hidden]{display:none!important}
#lgUpdateNotice .lg-up-head{display:flex;align-items:flex-start;gap:11px}
#lgUpdateNotice .lg-up-icon{display:grid;place-items:center;flex:0 0 38px;height:38px;border-radius:12px;background:rgba(111,173,100,.17);color:#258b36;font-size:21px}
#lgUpdateNotice strong{display:block;font-size:14px;line-height:1.45}
#lgUpdateNotice p{margin:4px 0 12px;font-size:12px;line-height:1.5;color:#56705d}
#lgUpdateNotice .lg-up-actions{display:flex;gap:9px;justify-content:flex-end}
#lgUpdateNotice button{border:0;border-radius:11px;font-weight:700;font-size:12px;padding:10px 13px;cursor:pointer;min-height:40px}
#lgUpdateNotice .lg-update-later{background:rgba(85,118,92,.10);color:inherit}
#lgUpdateNotice .lg-update-now{background:#aeef44;color:#16361c;box-shadow:0 4px 12px rgba(57,140,45,.16)}
#lgUpdateNotice button:focus-visible{outline:2px solid #4b9f54;outline-offset:2px}
body.darkmode #lgUpdateNotice,body[data-theme="dark"] #lgUpdateNotice,html[data-theme="dark"] #lgUpdateNotice{background:linear-gradient(145deg,rgba(27,49,35,.96),rgba(14,34,23,.95));color:#f1fff0;border-color:rgba(223,255,231,.24);box-shadow:0 18px 46px rgba(0,0,0,.42),inset 0 1px rgba(255,255,255,.10)}
body.darkmode #lgUpdateNotice p,body[data-theme="dark"] #lgUpdateNotice p,html[data-theme="dark"] #lgUpdateNotice p{color:#bacdbf}
body.darkmode #lgUpdateNotice .lg-update-later,body[data-theme="dark"] #lgUpdateNotice .lg-update-later,html[data-theme="dark"] #lgUpdateNotice .lg-update-later{background:rgba(255,255,255,.12)}
@keyframes lgUpdateArrive{from{transform:translateY(12px);opacity:0}to{transform:translateY(0);opacity:1}}
@media(prefers-reduced-motion:reduce){#lgUpdateNotice{animation:none}}

// Wrap a JPEG in a single Letter-sized PDF without a network dependency.
function mapPdfFromJpeg(jpeg, width, height) {
  const landscape = width > height;
  const pageWidth = landscape ? 792 : 612;
  const pageHeight = landscape ? 612 : 792;
  const scale = Math.min((pageWidth - 36) / width, (pageHeight - 36) / height);
  const drawWidth = width * scale;
  const drawHeight = height * scale;
  const placement = `q\n${drawWidth.toFixed(3)} 0 0 ${drawHeight.toFixed(3)} ${((pageWidth - drawWidth) / 2).toFixed(3)} ${((pageHeight - drawHeight) / 2).toFixed(3)} cm\n/Map Do\nQ\n`;
  const encoder = new TextEncoder();

  object('<< /Type /Pages /Kids [3 0 R] /Count 1 >>');
  object(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${pageWidth} ${pageHeight}] /Resources << /XObject << /Map 4 0 R >> >> /Contents 5 0 R >>`);
  object(`<< /Type /XObject /Subtype /Image /Width ${width} /Height ${height} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpeg.length} >>\nstream\n`, jpeg, '\nendstream');

  append(`xref\n0 ${offsets.length}\n0000000000 65535 f \n`);

function planLotMeasures(sheets,lots){
 const plans=[],errors=[],seen=new Set();
 const aliases={codigo:'id',bloque:'block',numero:'number',numerodesolar:'number',numerosolar:'number',solar:'number',lote:'number',tipo:'kind',area:'area',aream2:'area',precio:'price',preciodelterreno:'price',frente:'front',ancho:'front',fondo:'depth',largo:'depth',lateralizquierdo:'left',lateralderecho:'right'};
 for(const sheet of sheets){
  if(!sheet.rows.length)continue;
  const headers=sheet.rows[0].map(v=>aliases[normalizeClientLookup(v)]||'');
  if(!headers.includes('id')&&!(headers.includes('block')&&headers.includes('number'))){errors.push(sheet.sheet+': falta Código o Bloque y Número.');continue;}
  if(sheet.rows.length>3001)throw Error('Usa un máximo de 3000 filas por hoja.');
  for(let i=1;i<sheet.rows.length;i++){
   const row=sheet.rows[i];if(!row.some(v=>String(v??'').trim()))continue;
   try{
    const data={};headers.forEach((k,j)=>{if(k)data[k]=String(row[j]??'').trim();});
    const norm=normalizeClientLookup;
    const local=['local','localcomercial','commercial'].includes(norm(data.kind||''));
    if(data.kind&&!local&&!['solar','terreno','lote'].includes(norm(data.kind)))throw Error('Tipo debe ser Solar o Local.');
    const matches=lots.filter(l=>data.id?norm(l.id)===norm(data.id):norm(l.block)===norm(data.block)&&norm(l.sourceNumber||l.id)===norm(data.number)&&(!data.kind||local===(l.type==='commercial')));
    if(matches.length!==1)throw Error(matches.length?'Coincide con varios terrenos; usa Código.':'No existe el terreno en esta residencial.');
    const l=matches[0];if(seen.has(l.id))throw Error('Terreno repetido.');seen.add(l.id);
    if(data.id&&((data.block&&norm(data.block)!==norm(l.block))||(data.number&&norm(data.number)!==norm(l.sourceNumber||l.id))))throw Error('El bloque o número no corresponde al Código.');
    if(data.kind&&local!==(l.type==='commercial'))throw Error('El tipo no corresponde al terreno.');
    const patch={dimensions:{...l.dimensions}};let changed=false;
    for(const key of ['area','price','front','depth','left','right'])if(data[key]){const n=Number(data[key]);if(!Number.isFinite(n)||n<=0)throw Error('Revisa '+key+': debe ser un número mayor que cero, con punto decimal.');if(['area','price'].includes(key))patch[key]=n;else patch.dimensions[key]=n;changed=true;}
    if(changed){const automatic=calculatedLotArea(patch.dimensions);if(automatic!=null){patch.area=automatic;patch.areaMode='auto';patch.areaOrigin='calculated-front-depth';}else if(patch.area){patch.areaMode='manual';patch.areaOrigin='excel';}plans.push({id:l.id,block:l.block,number:l.sourceNumber||l.id,patch});}
   }catch(error){errors.push(sheet.sheet+' · fila '+(i+1)+': '+error.message);}
  }
 }
 return {plans,errors};
}

  if(plans.length&&!errors.length){lotImportPreview={plans,snapshot:JSON.stringify(db),stored:localStorage.getItem(STORAGE)};button.disabled=false;}

let buyerImportReadVersion = 0;
const buyerColumns = ['Codigo','Bloque','Numero','Tipo','Nombre','Identidad','Telefono','Direccion','Modalidad','Precio','Prima','Plazo_meses','Cuotas_pagadas','Fecha_venta','Primera_cuota'];
function buyerNumber(value, label, fallback = 0) {
  const raw = String(value ?? '').trim().replace(/^L\.?\s*/i, '').replace(/,/g, '');
  const number = raw === '' ? fallback : Number(raw);
  if (!Number.isFinite(number) || number < 0) throw Error('Revisa ' + label + '.');
  return number;
}
function buyerDate(value, label) {
  const text = String(value || '').trim();
  let date = text;
  if (/^\d{5}(\.\d+)?$/.test(text)) date = new Date(Date.UTC(1899,11,30) + Math.floor(Number(text)) * 86400000).toISOString().slice(0,10);
  const local = text.match(/^(\d{1,2})[/-](\d{1,2})[/-](\d{4})$/);
  if (local) date = local[3] + '-' + local[2].padStart(2,'0') + '-' + local[1].padStart(2,'0');
  if (!validSolarDate(date)) throw Error('Revisa ' + label + '. Usa AAAA-MM-DD o DD/MM/AAAA.');
  return date;
}
function buyerClient(data) {
  if (data.clientId) {
    const client = getClient(data.clientId);
    if (!client) throw Error('Selecciona un cliente válido.');
    return client;
  }
  const name = String(data.name || '').trim();
  const identity = String(data.identity || '').trim();
  if (!name || name.length > 150 || identity.length > 40) throw Error('Escribe el nombre del comprador y revisa su identidad.');
  const matches = identity ? db.clients.filter(c => normalizeClientLookup(c.identity) === normalizeClientLookup(identity)) : [];
  if (matches.length > 1) throw Error('La identidad coincide con varios clientes. Revisa Clientes.');
  if (matches[0] && normalizeClientLookup(matches[0].name) !== normalizeClientLookup(name)) throw Error('La identidad ya pertenece a otro nombre. Selecciona ese cliente o revisa el Excel.');
  return matches[0] || {name, identity, phone: String(data.phone || '').trim(), address: String(data.address || '').trim(), email: ''};
}
function planBuyerHistory(data, lot) {
  if (!lot || lot.status === 'private' || lot.type === 'private') throw Error('El terreno no existe o es propiedad privada.');
  if (activeReservation(lot.id)) throw Error('El solar tiene un apartado activo. Gestiónalo antes de cargar la compra.');
  const client = buyerClient(data);
  const existing = db.sales.find(s => s.lotId === lot.id);
  if (existing) {
    if (data.clientOnly === 'yes') return {lotId:lot.id, existingId:existing.id, client};
    throw Error('El terreno ya tiene una venta. Revisa su comprador desde Editar.');
  }
  const mode = normalizeClientLookup(data.mode);
  const type = ['contado','cash'].includes(mode) ? 'cash' : ['credito','credit'].includes(mode) ? 'credit' : '';
  if (!type) throw Error('Indica Contado o Crédito.');
  const price = buyerNumber(data.price, 'el precio', Number(lot.price) || 0);
  if (price <= 0) throw Error('Indica el precio total de la compra.');
  const date = buyerDate(data.date, 'la fecha de compra');
  if (date > businessToday()) throw Error('La fecha de compra no puede ser futura.');
  const downPayment = type === 'cash' ? price : buyerNumber(data.downPayment, 'la prima');
  const months = type === 'cash' ? 0 : buyerNumber(data.months, 'el plazo');
  const paid = buyerNumber(data.paid, 'las cuotas pagadas');
  if (!Number.isInteger(paid) || paid < 0 || type === 'cash' && paid !== 0) throw Error('Cuotas pagadas debe ser un entero, o cero para contado.');
  let firstDueDate = '';
  let openingPaid = price;
  if (type === 'credit') {
    if (!Number.isInteger(months) || months < 1 || months > 360 || paid > months || downPayment >= price) throw Error('Revisa el plazo (1 a 360), las cuotas pagadas y la prima.');
    firstDueDate = buyerDate(data.firstDueDate, 'la fecha de la primera cuota');
    if (firstDueDate < date) throw Error('La primera cuota no puede ser anterior a la compra.');
    const monthly = Math.round((price - downPayment) / months * 100) / 100;
    if(monthly<.01)throw Error('La cuota mensual calculada debe ser al menos L 0.01.');
    openingPaid = paid === months ? price : Math.round((downPayment + monthly * paid) * 100) / 100;
  }
  return {lotId:lot.id, client, sale:{type, price, downPayment, months, date, firstDueDate, openingPaid, importedPaidInstallments:paid, historical:true, importedAt:new Date().toISOString()}};
}
function applyBuyerHistory(plan) {
  const lot = getLot(plan.lotId);
  let client = plan.client;
  if (client.identity) client = db.clients.find(c => normalizeClientLookup(c.identity) === normalizeClientLookup(client.identity)) || client;
  if (!client.id) {client = {...client, id:'C-' + (crypto.randomUUID?.() || uid('H')+'-'+Date.now())}; db.clients.unshift(client);}
  if (plan.existingId) {getSale(plan.existingId).clientId = client.id; return;}
  db.sales.unshift({...plan.sale, id:'V-' + (crypto.randomUUID?.() || uid('H')+'-'+Date.now()), lotId:lot.id, clientId:client.id});
  lot.price = plan.sale.price;
  lot.status = 'sold';
  lot.mapDebtFlag = false;
  syncSolarMapRecord(lot);
}
function saveBuyerHistoryPlans(plans) {
  const snapshot = JSON.stringify(db);
  try {
    plans.forEach(applyBuyerHistory);
    localStorage.setItem(STORAGE, JSON.stringify(db));
  } catch (error) {db = JSON.parse(snapshot); throw Error('No se pudieron guardar los datos. Revisa el espacio disponible.');}
}

button class="btn btn-primary" type="submit" form="buyer-history-form">Guardar comprador y compra</button>', true);

function buyerCsvRows(text) {
  const firstLine = text.split(/\r?\n/)[0];
  const separator = firstLine.split(';').length > firstLine.split(',').length ? ';' : ',';
  const rows = []; let row = [], value = '', quoted = false;
  for (let i=0; i<text.length; i++) {
    const char=text[i];
    if (char==='"') {if(quoted&&text[i+1]==='"'){value+='"';i++;}else quoted=!quoted;}
    else if(!quoted&&char===separator){row.push(value);value='';}
    else if(!quoted&&char==='\n'){row.push(value.replace(/\r$/,''));if(row.some(v=>v.trim()))rows.push(row);row=[];value='';}
    else value+=char;
  }
  if(quoted)throw Error('CSV con comillas sin cerrar.');
  row.push(value.replace(/\r$/,''));if(row.some(v=>v.trim()))rows.push(row);
  return rows;
}

  const rows = residenceLots().filter(l=>l.status==='sold'&&!db.sales.some(s=>s.lotId===l.id)).map(l=>[l.id,l.block,l.sourceNumber||l.id,inventoryKind(l),'','','','','',l.price||'',0,'',0,'','']);
  const csv = '\ufeff' + [buyerColumns,...rows].map(row=>row.map(v=>'"'+String(v).replace(/^[=+@-]/,"'$&").replace(/"/g,'""')+'"').join(';')).join('\r\n');
  download('Plantilla-compradores-'+residence().name+'.csv',csv,'text/csv;charset=utf-8');
}

async function previewBuyerImport(file) {
  const readVersion = ++buyerImportReadVersion;
  buyerImportPreview = null;
  const area = $('#buyer-import-preview');
  const button = $('#buyer-import-confirm');
  if (!file || !area) return;
  button.disabled = true;
  area.textContent = 'Leyendo archivo…';
  try {
    if(file.size>8*1024*1024)throw Error('El archivo debe pesar menos de 8 MB.');
    const sheets=/\.xlsx$/i.test(file.name)?await readExcelRows(file):/\.csv$/i.test(file.name)?[{sheet:'CSV',rows:buyerCsvRows(await file.text())}]:(()=>{throw Error('Guarda el archivo como .xlsx o CSV UTF-8.');})();
    if(!area.isConnected || readVersion !== buyerImportReadVersion)return;
    const plans=[],errors=[],seen=new Set(),identities=new Map();
    const aliases={codigo:'id',codigoterreno:'id',bloque:'block',numero:'number',solar:'number',lote:'number',tipo:'kind',nombre:'name',nombredelcliente:'name',nombrecliente:'name',identidad:'identity',telefono:'phone',direccion:'address',modalidad:'mode',tipocompra:'mode',precio:'price',prima:'downPayment',plazomeses:'months',plazo:'months',cuotaspagadas:'paid',fechaventa:'date',primeracuota:'firstDueDate'};
    for(const sheet of sheets){
      const headers=sheet.rows[0].map(v=>aliases[normalizeClientLookup(v)]||'');
      if(!headers.includes('name')){errors.push(sheet.sheet+': falta la columna Nombre.');continue;}
      if(sheet.rows.length>3001)throw Error('Usa un máximo de 3000 filas por hoja.');
      for(let i=1;i<sheet.rows.length;i++){
        const data={};headers.forEach((key,index)=>{if(key)data[key]=sheet.rows[i][index]??'';});
        if(!String(data.name||'').trim())continue;
        try{
          const candidates=residenceLots().filter(l=>data.id?normalizeClientLookup(l.id)===normalizeClientLookup(data.id):normalizeClientLookup(l.block)===normalizeClientLookup(data.block)&&normalizeClientLookup(l.sourceNumber||l.id)===normalizeClientLookup(data.number)&&(['local','localcomercial','commercial'].includes(normalizeClientLookup(data.kind))?l.type==='commercial':l.type!=='commercial'));
          if(candidates.length!==1)throw Error(candidates.length?'Coincide con varios terrenos. Usa Código de la plantilla.':'No se encontró el terreno. Revisa Código o Bloque, Número y Tipo.');
          const lot=candidates[0];
          if(seen.has(lot.id))throw Error('Terreno repetido en el archivo.');
          seen.add(lot.id);
          const identity=normalizeClientLookup(data.identity);
          if(identity&&identities.has(identity)&&identities.get(identity)!==normalizeClientLookup(data.name))throw Error('La misma identidad aparece con nombres diferentes.');
          if(identity)identities.set(identity,normalizeClientLookup(data.name));
          plans.push(planBuyerHistory(data,lot));
        }catch(error){errors.push(sheet.sheet+' · fila '+(i+1)+': '+error.message);}
      }
    }
    area.innerHTML=`<p><b>${plans.length}</b> compras listas · <b>${errors.length}</b> errores.</p>${errors.length?'<p>Corrige los errores y vuelve a seleccionar el archivo.</p><ul>'+errors.slice(0,80).map(error=>'<li>'+esc(error)+'</li>').join('')+'</ul>':''}<div class="table-scroll"><table><thead><tr><th>Terreno</th><th>Comprador</th><th>Modalidad</th><th>Cuotas pagadas</th><th>Pagado histórico</th></tr></thead><tbody>${plans.slice(0,100).map(plan=>`<tr><td>${esc(plan.lotId)}</td><td>${esc(plan.client.name)}</td><td>${plan.sale.type==='cash'?'Contado':'Crédito'}</td><td>${plan.sale.importedPaidInstallments}/${plan.sale.months}</td><td>${money(plan.sale.openingPaid)}</td></tr>`).join('')}</tbody></table></div>`;
    if(!errors.length&&plans.length){buyerImportPreview={plans,snapshot:JSON.stringify(db),storedSnapshot:localStorage.getItem(STORAGE)};button.disabled=false;}
  }catch(error){if(area.isConnected&&readVersion===buyerImportReadVersion)area.textContent=error.message||'No se pudo leer el archivo.';}
}

const PANEL_THEMES=[['minimal','Minimalista claro','Blanco y azul, limpio y sencillo.'],['executive','Profesional ejecutivo','Azul marino y dorado, elegante.'],['natural','Moderno natural','Verde bosque y tonos suaves.']];

function schedule(){let rows=[];db.sales.filter(s=>s.type==='credit').forEach(s=>{

 for(let j=1;j<=s.months;j++){
  let due=j===s.months?Math.max(0,Math.round((capital-installment(s)*(s.months-1))*100)/100):installment(s);
  let applied=Math.max(0,Math.min(due,paid));paid=Math.max(0,paid-applied);
  let remaining=Math.max(0,Math.round((due-applied)*100)/100);
  let dueDate=dateKey(addMonths(s.firstDueDate||s.date,s.firstDueDate?j-1:j));let status=remaining<.01?'paid':toDate(dueDate)<toDate(new Date())?'late':'pending';

 }

function basePageContent(){switch(page){case 'dashboard':return dashboard();case 'finance':return financePage();case 'gps':return residencePicker()+croquisPanel()+gpsPage();case 'collections':return collectionPage();case 'arrayan':return arrayanPage();case 'residences':return residencesPage();case 'design':return designPage();case 'lots':return lotsPage();case 'sales':return salesPage();case 'clients':return clientsPage();case 'payments':return paymentsPage();case 'contracts':return contractsPage();case 'receipts':return receiptsPage();case 'reports':return reportsPage();case 'settings':return settingsPage();case 'users':return usersPage();case 'backup':return backupPage();default:return dashboard()}}
function header(title,subtitle,actions='',kicker='Gestión de lotificación'){return `<div class="page-head"><div><div class="page-kicker">${ic('layers','small-icon')}${esc(kicker)}</div><h1>${title}</h1><p>${subtitle}</p></div><div class="head-actions">${actions}</div></div>`}
function stateBadge(st){const names={available:'Disponible',private:'Propiedad privada',sold:'Comprado',reserved:'Apartado',credit:'Al crédito',paid:'Pagada',late:'Vencida',pending:'Pendiente',active:'Activo',cash:'Contado'};const cls={available:'yellow',private:'gray',sold:'green',reserved:'yellow',credit:'blue',paid:'green',late:'red',pending:'yellow',active:'blue',cash:'green'};return `<span class="status status-${cls[st]||'gray'}">${names[st]||esc(st)}</span>`}
function statCard(title,val,icon,color,desc=''){return `<div class="card stat-card"><div class="stat-icon ${color}">${ic(icon)}</div><div style="min-width:0"><div class="stat-label">${title}</div><div class="stat-value tabular">${val}</div><div class="stat-caption">${desc}</div></div></div>`}
function financialCard(title,val,icon,color){return `<div class="card money-card"><div class="stat-icon ${color}">${ic(icon)}</div><div style="min-width:0"><div class="stat-label">${title}</div><div class="stat-value tabular">${money(val)}</div></div></div>`}
function totals(){let counts=lotCounts(),totalSold=sum(db.sales,s=>s.price),collected=sum(db.payments,p=>p.amount),pending=sum(db.sales,s=>balance(s)),monthly=sum(db.payments.filter(p=>toDate(p.date).getFullYear()===new Date().getFullYear()&&toDate(p.date).getMonth()===new Date().getMonth()),p=>p.amount),salesThisMonth=sum(db.sales.filter(s=>toDate(s.date).getFullYear()===new Date().getFullYear()&&toDate(s.date).getMonth()===new Date().getMonth()),s=>s.price);return {...counts,totalSold,collected,pending,monthly,salesThisMonth}}

v></div><div class="card"><div class="card-header"><h2 class="card-title">${ic('plus')} Accesos rápidos</h2></div><div class="quick-grid"><button class="quick-tile" data-action="new-lot">${ic('plus')} Añadir terreno</button><button class="quick-tile" data-action="new-client">${ic('users')} Nuevo cliente</button><button class="quick-tile" data-action="new-sale">${ic('handshake')} Registrar venta</button><button class="quick-tile" data-action="new-payment">${ic('wallet')} Registrar abono</button></div></div></div></div>`}

 const base=(st-1)*40;let rects='';for(let r=0;r<3;r++)for(let col=0;col<10;col++){
 let idx=base+r*10+col;const l=db?.lots[idx];if(!l)continue;const sale=db.sales.find(s=>s.lotId===l.id);let status=l.status==='sold'&&sale?.type==='credit'?'credit':l.status;status=mapVisualStatus(l);const palette={available:'#f4cd71',sold:'#5dc39a',reserved:'#f4cd71',credit:'#5dc39a',debt:'#e97980'};let x=58+col*78,y=52+r*106;rects+=`<g class="map-lot" data-lot="${esc(l.id)}" tabindex="0" role="button" aria-label="Ver lote ${esc(l.id)}"><rect x="${x}" y="${y}" width="75" height="75" rx="3" fill="${palette[status]}" stroke="#fff" stroke-width="3"/><text x="${x+37.5}" y="${y+44}" fill="#0c3443" text-anchor="middle" font-size="13">${esc(l.id)}</text></g>`}

 return `<svg class="lot-map" viewBox="0 0 900 380" role="img" aria-label="Plano ilustrativo de los primeros 30 terrenos de la etapa ${st}"><rect width="900" height="380" fill="#e9f4df"/><path d="M0 23Q180 -5 320 16T630 11T900 25" fill="none" stroke="#c3dcb6" stroke-width="18"/>${trees}<rect x="35" y="35" width="830" height="337" rx="42" fill="#7d9299"/><rect x="50" y="45" width="800" height="320" rx="23" fill="#cfeacb"/><path d="M38 141H862M38 247H862" stroke="#8299a1" stroke-width="22"/><path d="M50 141H850M50 247H850" stroke="#fff" stroke-width="1.5" stroke-dasharray="13 13" opacity=".7"/>${rects}<g opacity=".95"><circle cx="22" cy="105" r="13" fill="#53a880"/><circle cx="879" cy="203" r="17" fill="#53a880"/><circle cx="20" cy="300" r="13" fill="#65b88e"/><circle cx="885" cy="323" r="11" fill="#65b88e"/></g></svg>`}

function paymentsPage(){let s=schedule().filter(r=>r.remaining>.009).filter(r=>!filter||`${r.saleId} ${r.lot?.id||''} ${r.client?.name||''}`.toLowerCase().includes(filter.toLowerCase())).sort((a,b)=>a.dueDate.localeCompare(b.dueDate));let late=s.filter(r=>r.status==='late');return `${header('Cuotas y pagos','Control de vencimientos, abonos y saldos de ventas al crédito.',button(`${ic('plus')} Registrar abono`,'new-payment','btn-primary'))}<div class="cards-four" style="margin-bottom:17px">${statCard('Cuotas pendientes',number(s.length),'calendar','blue','Aún no pagadas')}${statCard('Cuotas vencidas',number(late.length),'clock','rose','Requieren seguimiento')}${statCard('Créditos activos',number(db.sales.filter(x=>x.type==='credit'&&balance(x)>0).length),'credit','navy','Con saldo pendiente')}${statCard('Cartera por cobrar',money(totals().pending),'wallet','','Saldo total')}</div><div class="card"><div class="panel-table-head"><h2>Calendario de cuotas pendientes</h2></div><div style="padding:0 19px">${toolbar('Buscar cliente o lote…')}</div><div class="table-scroll" tabindex="0" role="region" aria-label="Tabla desplazable horizontalmente"><table><thead><tr><th>Cliente</th><th>Lote</th><th>Cuota</th><th>Vencimiento</th><th>Monto restante</th><th>Estado</th><th>Acción</th></tr></thead><tbody>${s.slice(0,180).map(r=>`<tr><td class="strong">${esc(r.client?.name||'—')}</td><td>${esc(r.lot?.id||'—')}</td><td>${r.number}/${r.total}</td><td>${fmtDate(r.dueDate)}</td><td class="strong tabular">${money(r.remaining)}</td><td>${stateBadge(r.status)}</td><td>${button(`${ic('money')} Abonar`,'new-payment','btn-outline btn-sm',`data-id="${esc(r.saleId)}"`)}</td></tr>`).join('')}</tbody></table>${!s.length?'<div class="empty">No hay cuotas pendientes con ese filtro.</div>':''}</div></div><div class="notice-card" style="margin-top:16px">Las cuotas del prototipo se calculan sin intereses y se aplican por orden de vencimiento. La configuración de mora avanzada se desarrollará en una fase posterior.</div>`}
let contractScan=null,contractOcrLoader=null;
function contractsPage(){const list=db.sales.filter(s=>getLot(s.lotId)?.residenceId===residence().id).sort((a,b)=>b.date.localeCompare(a.date));const docs=(db.contractTexts||[]).filter(d=>d.residenceId===residence().id);return `${residencePicker()}${header('Contratos','Escanea hasta tres páginas por contrato y guarda solo su texto.',button('Escanear contrato de un cliente','contract-scan-choose','btn-primary'))}<section class="card" style="padding:20px;margin-bottom:20px"><h3>Contratos escaneados · ${esc(residence().name)}</h3>${docs.length?docs.map(d=>`<div class="detail-line" style="flex-wrap:wrap;gap:10px"><div><b>${esc(getClient(d.clientId)?.name||'Cliente')}</b><p class="sm">${esc(d.saleId?getSale(d.saleId)?.lotId||'':'Sin terreno vinculado')} · ${d.pages.length} página(s) · Solo texto · ${number(new Blob([JSON.stringify(d)]).size/1024)} KB</p></div><button class="btn btn-outline" data-action="contract-text-view" data-id="${esc(d.id)}">Ver información</button></div>`).join(''):'<p class="muted">Todavía no hay contratos escaneados en esta residencial.</p>'}</section><div class="card"><div class="panel-table-head"><h2>Clientes con compra en esta residencial</h2></div><div class="table-scroll"><table><thead><tr><th>Cliente</th><th>Bloque / Solar</th><th>Fecha</th><th>Contrato</th></tr></thead><tbody>${list.map(s=>{const l=getLot(s.lotId);return `<tr><td>${esc(getClient(s.clientId)?.name||'Cliente')}</td><td>${esc(l?.block||'')} / ${esc(l?.sourceNumber||s.lotId)}</td><td>${fmtDate(s.date)}</td><td><button class="btn btn-primary btn-sm" data-action="contract-scan" data-client="${esc(s.clientId)}" data-id="${esc(s.id)}">Escanear contrato</button> ${button('Ver plantilla','contract-preview','btn-outline btn-sm',`data-id="${esc(s.id)}"`)}</td></tr>`;}).join('')}</tbody></table>${!list.length?'<p style="padding:20px">No hay compras registradas. Puedes escanear un contrato eligiendo un cliente desde el botón superior.</p>':''}</div></div><p class="sm muted">Los escaneos function chooseContractScanClient(){showModal('Escanear contrato · Elegir cliente',`<label for="contract-client-search">Buscar cliente por nombre o identidad</label><input id="contract-client-search" type="search" autocomplete="off" placeholder="Escribe para buscar"><div id="contract-client-results" style="max-height:340px;overflow:auto;margin-top:15px"></div>`,'<button class="btn btn-soft" data-action="close-modal">Cerrar</button>',true);renderContractClientResults();}
function renderContractClientResults(){const el=$('#contract-client-results');if(!el)return;const q=normalizeClientLookup($('#contract-client-search').value);const clients=db.clients.filter(c=>!q||normalizeClientLookup(c.name+' '+c.identity).includes(q));el.innerHTML=clients.slice(0,80).map(c=>`<button class="btn btn-outline" style="display:block;width:100%;margin:6px 0;text-align:left" data-action="contract-scan" data-client="${esc(c.id)}">${esc(c.name)} · ${esc(c.identity||'Sin identidad')}</button>`).join('')||'<p>No hay clientes con esa búsqueda. Registra primero al cliente.</p>';}
function openContractScan(clientId,saleId='',docId=''){const client=getClient(clientId);if(!client)return;const doc=(db.contractTexts||[]).find(d=>d.id===docId);const sales=db.sales.filter(s=>s.clientId===clientId&&getLot(s.lotId)?.residenceId===residence().id);contractScan={token:uid('SCAN'),clientId,residenceId:residence().id,docId:doc?.id||'',busy:false,pages:(doc?.pages||[]).map(p=>({...p}))};
 showModal('Escanear contrato · '+esc(client.name),`<form id="contract-scan-form"><p>Hasta <b>3 páginas</b>. Toma la foto de frente, con buena luz y el texto completo. Revisa nombres, identidad, medidas, precios y fechas.</p><label>Título del contrato<input name="title" value="${esc(doc?.title||'CONTRATO DE COMPRAVENTA')}" maxlength="160" required></label><label style="display:block;margin:12px 0">Terreno de esta residencial<select name="saleId"><option value="">Sin terreno vinculado</option>${sales.map(s=>`<option value="${esc(s.id)}" ${(doc?.saleId||saleId)===s.id?'selected':''}>${esc(s.lotId)} · Bloque ${esc(getLot(s.lotId)?.block||'')}</option>`).join('')}</select></label><div class="notice-card">Las fotos se usan temporalmente para leer el texto. Al guardar se conserva <b>solo la información escrita</b>; no se guardan las imágenes.</div>${[0,1,2].map(i=>`<section class="card" style="padding:15px;margin-top:12px"><h3>Página ${i+1}</h3><div style="display:flex;gap:8px;flex-wrap:wrap"><label class="btn btn-primary">Tomar foto<input type="file" accept="image/*" capture="environment" data-contract-photo="${i}" hidden></label><label class="btn btn-outline">Subir foto<input type="file" accept="image/*" data-contract-photo="${i}" hidden></label></div><p id="contract-ocr-status-${i}" class="sm" role="status">${contractScan.pages[i]?.text?'Texto cargado. Puedes corregirlo o reemplazar la foto.':'Sin página. Puedes usar de una a tres páginas.'}</p><label>Texto reconocido · editable<textarea data-contract-text="${i}" rows="8" style="width:100%;resize:vertical" maxlength="50000">${esc(contractScan.pages[i]?.text||'')}</textarea></label></section>`).join('')}<p id="contract-scan-error" role="alert" style="color:#bd3742"></p></form>`,'<button class="btn btn-soft" data-action="close-modal">Cerrar</button><button class="btn btn-primary" form="contract-scan-form" type="submit">Guardar solo información del contrato</button>',true);
}
async function loadContractOcr(){if(window.Tesseract)return window.Tesseract;if(!contractOcrLoader)contractOcrLoader=new Promise((resolve,reject)=>{const script=document.createElement('script');script.src='ocr/tesseract.min.js';script.onload=()=>resolve(window.Tesseract);script.onerror=()=>{contractOcrLoader=null;script.remove();reject(Error('No se pudo cargar el lector OCR. Revisa tu conexión e intenta de nuevo.'));};document.head.appendChild(script);});return contractOcrLoader;}
async function readContractPhoto(input){const file=input.files?.[0],index=Number(input.dataset.contractPhoto),scan=contractScan,form=$('#contract-scan-form'),status=$('#contract-ocr-status-'+index);if(!file||!scan||!form)return;if(scan.busy){toast('Espera a que termine de leer la página actual.','error');input.value='';return;}
 let worker,bitmap,canvas;scan.busy=true;form.querySelectorAll('input[type=file]').forEach(el=>el.disabled=true);document.querySelector('[form="contract-scan-form"][type=submit]').disabled=true;const valid=()=>contractScan===scan&&form.isConnected;const update=t=>{if(valid())status.textContent=t;};
 try{if(!file.type.startsWith('image/')||file.size>20*1024*1024)throw Error('Usa una foto JPG, PNG o WebP de hasta 20 MB.');update('Preparando foto…');bitmap=await createImageBitmap(file);const factor=Math.min(1,2200/Math.max(bitmap.width,bitmap.height));canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(bitmap.width*factor));canvas.height=Math.max(1,Math.round(bitmap.height*factor));const ctx=canvas.getContext('2d');ctx.fillStyle='white';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(bitmap,0,0,canvas.width,canvas.height);bitmap.close();bitmap=null;const T=await loadContractOcr();if(!valid())return;update('Cargando lector de español. La primera lectura puede tardar…');const root=new URL('ocr/',location.href).href;worker=await T.createWorker('spa',1,{workerPath:root+'worker.min.js',corePath:root+'core',langPath:root+'lang',logger:m=>{if(m.status==='recognizing text')update('Leyendo página '+(index+1)+' · '+Math.round(m.progress*100)+'%');}});if(!valid())return;const {data}=await worker.recognize(canvas,{rotateAuto:true});if(!valid())return;const text=String(data.text||'').trim().toLocaleUpperCase('es-HN');if(!text)throw Error('No se encontró texto legible. Toma otra foto con más luz y sin recortar las letras.');scan.pages[index]={number:index+1,text,confidence:Math.round(data.confidence||0)};form.querySelector('[data-contract-text="'+index+'"]').value=text;update('Página '+(index+1)+' leída · Revisa y corrige el texto antes de guardar. Calidad estimada: '+Math.round(data.confidence||0)+'%.');
 }catch(e){update(e.message||'No se pudo leer la foto. Prueba JPG o PNG.');}finally{if(bitmap)bitmap.close();if(canvas){canvas.width=1;canvas.height=1;}if(worker)await worker.terminate().catch(()=>{});input.value='';scan.busy=false;if(valid()){form.querySelectorAll('input[type=file]').forEach(el=>el.disabled=false);document.querySelector('[form="contract-scan-form"][type=submit]').disabled=false;}}
}
function contractTextRecord(scan,data,texts){if(!scan||!getClient(scan.clientId))throw Error('Selecciona un cliente válido.');if(scan.busy)throw Error('Espera a que termine el OCR.');const title=String(data.title||'').trim().toLocaleUpperCase('es-HN');if(!title||title.length>160)throw Error('Revisa el título del contrato.');const pages=texts.map((text,i)=>({number:i+1,text:String(text||'').trim().toLocaleUpperCase('es-HN'),confidence:scan.pages[i]?.confidence??null})).filter(p=>p.text);if(!pages.length||pages.length>3||pages.some(p=>p.text.length>50000))throw Error('Guarda entre una y tres páginas de texto, hasta 50,000 caracteres por página.');const saleId=String(data.saleId||'');if(saleId){const s=getSale(saleId);if(!s||s.clientId!==scan.clientId||getLot(s.lotId)?.residenceId!==scan.residenceId)throw Error('El terreno no pertenece al cliente o a esta residencial.');}return {id:scan.docId||uid('OCR'),clientId:scan.clientId,saleId,residenceId:scan.residenceId,title,pages,updatedAt:new Date().toISOString(),format:'text-only'};}

function calculatedLotArea(dimensions){const front=Number(dimensions?.front),depth=Number(dimensions?.depth);if(!Number.isFinite(front)||!Number.isFinite(depth)||front<=0||depth<=0)return null;const area=Math.round(front*depth*100)/100;return Number.isFinite(area)&&area>0?area:null;}

let paymentDraft=null;
function paymentCandidates(query=''){
 const words=String(query).toLowerCase().replace(/\b(bloque|solar|terreno|numero|número|lote)\b/g,' ').split(/\s+/).map(normalizeClientLookup).filter(Boolean);
 return db.sales.filter(s=>getLot(s.lotId)?.residenceId===paymentDraft?.residenceId&&balance(s)>.009).filter(s=>{const l=getLot(s.lotId),c=getClient(s.clientId);const text=normalizeClientLookup(`${c?.name||''} ${l.block} ${l.sourceNumber||''} ${l.id}`);return words.every(w=>text.includes(w));});
}
function newPayment(saleId){
 const rid=residence().id,sale=saleId?getSale(saleId):null;
 if(sale&&getLot(sale.lotId)?.residenceId!==rid){toast('Selecciona primero la residencial de ese terreno.','error');return;}
 paymentDraft={residenceId:rid,clientId:sale?.clientId||null,amounts:{},snapshot:JSON.stringify(db),stored:localStorage.getItem(STORAGE)};
 if(!paymentCandidates().length){toast('No hay terrenos con saldo en '+residence().name,'error');return;}
 if(sale)paymentDraft.amounts[sale.id]='';
 showModal('Registrar pago o abono',`<p><b>${esc(residence().name)}</b> · Puedes abonar a varios terrenos del mismo cliente.</p><form id="multi-payment-form"><label for="multi-payment-search">Buscar cliente, bloque o número de terreno</label><input id="multi-payment-search" placeholder="Nombre, bloque A o solar 12" autocomplete="off"><div id="multi-payment-results" style="max-height:220px;overflow:auto;margin:12px 0"></div><h3>Terrenos seleccionados</h3><div id="multi-payment-selected"></div><div class="form-grid">${field('Fecha del pago','date',businessToday(),{type:'date',required:true})}${field('Método de pago','method','Efectivo',{required:true})}${field('Concepto / observación','concept','Abono a crédito',{full:true,required:true})}</div><div id="multi-payment-total" class="sale-summary"></div><p id="multi-payment-error" role="alert" style="color:#bd3742"></p></form>`, '<button class="btn btn-soft" data-action="close-modal">Cancelar</button><button class="btn btn-primary" form="multi-payment-form" type="submit">Registrar pagos y crear recibo</button>',true);

function geoSetup(){let r=residence();if(!r.geoConfig)r.geoConfig={center:[14.8,-86.4],zoom:7,homeSet:false,layer:'osm'};return r.geoConfig}
function geoLots(){return residenceLots().filter(l=>Array.isArray(l.geo)&&l.geo.length>=3)}
function geoSaleStatus(l){let s=db.sales.find(s=>s.lotId===l.id);return l.status==='sold'&&s?.type==='credit'&&balance(s)>.01?'credit':l.status}
function geoEstimateArea(points){if(!Array.isArray(points)||points.length<3)return 0;const r=Math.PI/180,R=6378137;let a=0;for(let i=0;i<points.length;i++){let p=points[i],q=points[(i+1)%points.length];a+=(q[1]-p[1])*r*(2+Math.sin(p[0]*r)+Math.sin(q[0]*r))}return Math.abs(a*R*R/2)}
function geoNormalize(points){if(!Array.isArray(points)||points.length<3||points.length>250)return null;let out=[];for(let point of points){if(!Array.isArray(point)||point.length<2)return null;let lat=Number(point[0]),lng=Number(point[1]);if(!Number.isFinite(lat)||!Number.isFinite(lng)||lat < -90||lat > 90||lng < -180||lng > 180)return null;out.push([Math.round(lat*1e7)/1e7,Math.round(lng*1e7)/1e7])}if(out.length>=4&&out[0][0]===out.at(-1)[0]&&out[0][1]===out.at(-1)[1])out.pop();return out.length>=3?out:null}
const geoColor={available:'#13a77c',reserved:'#efb442',sold:'#e35b65',credit:'#2b84df'};
function mapVisualStatus(l){let sale=db.sales.find(s=>s.lotId===l.id);let owing=sale?.type==='credit'&&schedule().some(r=>r.saleId===sale.id&&r.remaining>.009&&(r.status==='late'||r.dueDate.slice(0,7)===dateKey(new Date()).slice(0,7)));return owing?'debt':l.status==='private'?'private':l.status==='reserved'?'reserved':l.status==='sold'?'sold':'available'}
function geoStatusColor(l){return {sold:'#5dc39a',debt:'#e97980',available:'#f4cd71',private:'#c6d0d4',reserved:'#e8ab38'}[mapVisualStatus(l)]}
function geoMapLabel(l){return `<span class="geo-lot-label">${esc(l.id)}</span>`}

function geoPopulateLotForm(val){let l=val==='new'?null:getLot(val),form=$('#modal-form[data-form="geo-lot"]');if(!form)return;const set=(name,value)=>{const el=form.elements[name];if(el)el.value=value};if(l){set('newId',l.id);set('stage',l.stage);set('block',l.block);set('area',l.area);set('price',l.price);set('status',l.status)}else{let n='L-'+String(Math.max(0,...db.lots.map(v=>Number(String(v.id).replace(/\D/g,''))||0))+1).padStart(3,'0');set('newId',n);set('stage',1);set('block','A');set('area',Math.max(.01,Math.round(geoEstimateArea(geoPending?.geometry||[])*100)/100));set('price',250000);set('status','available')}['newId','stage','block','area','price','status'].forEach(k=>{let el=form.elements[k];if(el)el.disabled=!!l})}
function geoCommitLot(data){let coords=geoNormalize(geoPending?.geometry);if(!coords){toast('Primero dibuja un perímetro válido.','error');return}let lot=data.existing==='new'?null:getLot(data.existing);if(lot&&lot.residenceId!==residence().id){toast('El terreno pertenece a otra residencial.','error');return}if(data.existing!=='new'&&!lot){toast('Terreno vinculado no encontrado.','error');return}if(lot&&lot.geo?.length&&!confirm(`El terreno ${lot.id} ya tiene un perímetro. ¿Deseas reemplazarlo?`))return;if(!lot){let id=(data.newId||'').trim().toUpperCase(),stage=Number(data.stage),area=Number(data.area),price=Number(data.price),status=data.status;if(!id||getLot(id)||!Number.isInteger(stage)||stage<1||!Number.isFinite(area)||area<=0||!Number.isFinite(price)||price<=0||!['available','reserved'].includes(status)){toast('Revisa código, residencial, precio y área del nuevo terreno.','error');return}lot={id,residenceId:residence().id,stage,block:String(data.block||'A').trim().toUpperCase(),area,price,status};db.lots.push(lot)}lot.geo=coords;lot.geoArea=Math.round(geoEstimateArea(coords)*100)/100;let cfg=geoSetup();if(!cfg.homeSet){cfg.center=[coords[0][0],coords[0][1]];cfg.zoom=17;cfg.homeSet=true}else if(geoMap){cfg.center=[geoMap.getCenter().lat,geoMap.getCenter().lng];cfg.zoom=geoMap.getZoom()}save();geoPending=null;closeModal();page='gps';geoStage='all';render();setTimeout(()=>geoFocus(lot.id),150);toast(`Perímetro GPS guardado para ${lot.id}`)}
function geoFocus(id){let l=getLot(id);if(l&&l.residenceId!==residence().id){db.currentResidence=l.residenceId;page='gps';save();render();setTimeout(()=>geoFocus(id),250);return}if(!l||!l.geo?.length){toast('Este terreno todavía no tiene polígono GPS.','error');return}if(page!=='gps'&&page!=='dashboard'){page='gps';render();setTimeout(()=>geoFocus(id),400);return}if(!geoMap){toast('El mapa no está disponible en este momento.','error');return}if(geoStage!=='all'&&String(l.stage)!==String(geoStage)){geoStage='all';render();setTimeout(()=>geoFocus(id),200);return}let layer=geoLayers.getLayers().find(ly=>ly._lotId===id);if(!layer)return;geoMap.fitBounds(layer.getBounds(),{maxZoom:19,padding:[45,45]});layer.openPopup()}
function geoEditPolygon(id){if(!geoMap){toast('Mapa no disponible.','error');return}let lot=getLot(id),layer=geoLayers.getLayers().find(ly=>ly._lotId===id);if(!lot||!layer)return;if(geoActiveEdit)geoCancelEdit();geoMap.closePopup();if(!layer.editing){toast('Activa Internet para cargar el editor de vértices.','error');return}let before=JSON.parse(JSON.stringify(lot.geo));geoActiveEdit={lotId:id,layer,before};layer.editing.enable();let banner=document.createElement('div');banner.className='geo-edit-banner';banner.id='geo-edit-banner';banner.innerHTML=`<div>${ic('edit')} <strong>Editando ${esc(id)}</strong><span>Arrastra los puntos del contorno.</span></div><div><button class="btn btn-primary btn-sm" data-action="geo-save-edit">${ic('check')} Guardar</button><button class="btn btn-soft btn-sm" data-action="geo-cancel-edit">Cancelar</button></div>`;$('#geo-map')?.appendChild(banner);toast('Arrastra los vértices del terreno y guarda los cambios.')}

function geoLocate(){if(!navigator.geolocation){toast('El navegador no tiene acceso a GPS. Usa coordenadas manuales.','error');return}toast('Solicitando permiso para consultar tu ubicación…');navigator.geolocation.getCurrentPosition(pos=>{if(page!=='gps'){page='gps';render()}let lat=pos.coords.latitude,lng=pos.coords.longitude;if(!geoMap){geoCenterDialog();return}geoMap.setView([lat,lng],Math.max(17,geoMap.getZoom()));if(geoCurrentPin)geoMap.removeLayer(geoCurrentPin);geoCurrentPin=L.circle([lat,lng],{radius:Math.max(4,pos.coords.accuracy||10),color:'#2582e2',fillOpacity:.08,weight:2}).addTo(geoMap).bindPopup(`Ubicación aproximada del dispositivo (precisión ~${Math.round(pos.coords.accuracy)} m)`).openPopup();toast('GPS encontrado. Guarda esta vista si corresponde a la lotificación.')},err=>toast(err.code===1?'Permiso de GPS denegado. Puedes ingresar coordenadas.':'No fue posible obtener la ubicación; ingresa coordenadas manualmente.','error'),{enableHighAccuracy:true,timeout:14000,maximumAge:20000})}

async function exportSolarMap(action, button) {
  button.disabled = true;
  let sourceUrl;
  try {
    const name = residence().name;
    const filename = 'Mapa de solares - ' + name.replace(/[\\/:*?"<>|]/g, '-') + '.pdf';
    const svg = new DOMParser().parseFromString(arrayanSvg(true), 'image/svg+xml').documentElement;
    const [, , viewWidth, viewHeight] = svg.getAttribute('viewBox').trim().split(/\s+/).map(Number);
    const scale = 2600 / Math.max(viewWidth, viewHeight);
    const mapWidth = Math.max(1, Math.round(viewWidth * scale));
    const mapHeight = Math.max(1, Math.round(viewHeight * scale));
    svg.removeAttribute('style');
    svg.setAttribute('width', mapWidth);
    svg.setAttribute('height', mapHeight);
    sourceUrl = URL.createObjectURL(new Blob([new XMLSerializer().serializeToString(svg)], {type:'image/svg+xml'}));
    const mapImage = new Image();
    mapImage.src = sourceUrl;
    await mapImage.decode();

    const canvas = document.createElement('canvas');
    canvas.width = Math.max(1200, mapWidth + 96);
    canvas.height = mapHeight + 208;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#153b50';
    ctx.font = 'bold 44px Arial';
    ctx.fillText('Mapa de solares', 48, 60);
    ctx.font = '30px Arial';
    ctx.fillText(name, 48, 103, canvas.width - 96);
    const mapLeft = (canvas.width - mapWidth) / 2;
    ctx.fillStyle = '#e6efe1';
    ctx.fillRect(mapLeft, 124, mapWidth, mapHeight);
    ctx.drawImage(mapImage, mapLeft, 124, mapWidth, mapHeight);
    const legend = [['available','Disponible'],['reserved','Apartado'],['sold','Comprado'],['debt','Cuota pendiente'],['private','Privado']];
    const column = (canvas.width - 96) / legend.length;
    ctx.font = '24px Arial';
    legend.forEach(([status, label], index) => {
      const x = 48 + index * column;
      ctx.fillStyle = arrayanColors[status];
      ctx.fillRect(x, mapHeight + 151, 22, 22);
      ctx.fillStyle = '#153b50';
      ctx.fillText(label, x + 30, mapHeight + 171, column - 36);
    });
    const jpeg = Uint8Array.from(atob(canvas.toDataURL('image/jpeg', .94).split(',')[1]), c => c.charCodeAt(0));
    const pdf = mapPdfFromJpeg(jpeg, canvas.width, canvas.height);

    if (action === 'share') {
      const files = [new File([pdf], filename, {type: 'application/pdf'})];
      if (navigator.share && navigator.canShare?.({files})) {
        try {
          await navigator.share({files});
          return;
        } catch (error) {
          if (error.name === 'AbortError') return;
        }
      }
      download(filename, pdf, 'application/pdf');
      showModal('Enviar por WhatsApp', '<p>Se descargó el PDF. Abre WhatsApp, elige el chat y adjunta el archivo como documento.</p><a class="btn btn-primary" href="https://web.whatsapp.com/" target="_blank" rel="noopener noreferrer">Abrir WhatsApp Web</a>', '');
      return;
    }
    download(filename, pdf, 'application/pdf');
    toast('Mapa descargado en PDF');
  } catch (error) {
    toast('No se pudo generar el PDF del mapa. Inténtalo de nuevo.', 'error');
  } finally {
    if (sourceUrl) URL.revokeObjectURL(sourceUrl);
    button.disabled = false;
  }
}

function financeKpis(r){return `<div class="cards-four" style="margin-bottom:18px">${financialCard('Ingresos recibidos',r.income,'wallet','')}${financialCard('Egresos pagados',r.expense,'money','amber')}<div class="card financial-card" style="padding:20px;border-top:3px solid ${r.utility>=0?'#0a9b71':'#d64c55'}"><span class="sm muted">Utilidad de caja</span><strong style="display:block;font-size:25px;margin-top:10px;color:${r.utility>=0?'#087a5b':'#bd3742'}">${money(r.utility)}</strong><span class="sm muted">Ingresos menos egresos del período</span></div><div class="card" style="padding:20px"><span class="sm muted">Margen de caja</span><strong style="display:block;font-size:25px;margin-top:10px">${r.margin==null?'Sin ingresos':number(r.margin)+'%'}</strong><span class="sm muted">${r.active.length} movimientos registrados</span></div></div>`}
function financeChart(buckets,kind){let w=700,h=235,left=75,right=18,top=22,bottom=43,innerW=w-left-right,innerH=h-top-bottom,max=Math.max(...buckets.map(b=>b[kind]),1),step=innerW/Math.max(1,buckets.length),barWidth=Math.min(38,step*.66),color=kind==='income'?'#0a9b71':'#d64c55',labelEvery=Math.max(1,Math.ceil(buckets.length/10)),compact=v=>'L. '+new Intl.NumberFormat('es-HN',{notation:'compact',maximumFractionDigits:1}).format(v);return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w} ${h}" role="img" aria-label="${kind==='income'?'Gráfica de ingresos recibidos':'Gráfica de egresos pagados'}" style="width:100%;height:auto;display:block"><title>${kind==='income'?'Ingresos recibidos':'Egresos pagados'} por ${financeFilter.period==='monthly'?'día':'mes'}</title>${[0,.5,1].map(t=>{let y=top+innerH-innerH*t;return `<line x1="${left}" x2="${w-right}" y1="${y}" y2="${y}" stroke="#e1eaf0"/><text x="${left-8}" y="${y+4}" text-anchor="end" font-family="Arial" font-size="11" fill="#617989">${compact(max*t)}</text>`}).join('')}${buckets.map((b,i)=>{let value=b[kind],barH=value/max*innerH,x=left+i*step+(step-barWidth)/2,y=top+innerH-barH;return `<g><title>${esc(b.label)}: ${money(value)}</title><rect x="${x}" y="${y}" width="${barWidth}" height="${barH}" rx="2" fill="${color}"/>${i%labelEvery===0||i===buckets.length-1?`<text x="${left+(i+.5)*step}" y="${h-20}" text-anchor="middle" font-family="Arial" font-size="11" fill="#617989">${esc(b.label)}</text>`:''}</g>`}).join('')}</svg>`}
function financeCategoryChart(categories){if(!categories.length)return '<div class="empty">No hay gastos registrados en este período.</div>';let rows=categories.slice(0,8);if(categories.length>8)rows.push({name:'Otras categorías',amount:categories.slice(8).reduce((a,b)=>a+b.amount,0)});let max=Math.max(...rows.map(r=>r.amount),1),height=rows.length*35+15;return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 ${height}" role="img" aria-label="Gráfica de gastos por categoría" style="display:block;width:100%;height:auto">${rows.map((r,i)=>`<g><title>${esc(r.name)}: ${money(r.amount)}</title><text x="0" y="${i*35+22}" font-family="Arial" font-size="12" fill="#29475a">${esc(r.name.length>31?r.name.slice(0,29)+'…':r.name)}</text><rect x="220" y="${i*35+7}" width="${r.amount/max*340}" height="20" rx="3" fill="#df9b26"/><text x="575" y="${i*35+22}" font-family="Arial" font-size="12" fill="#29475a">${money(r.amount)}</text></g>`).join('')}</svg>`}
function financeCharts(r){return `<div class="grid-two" style="margin-bottom:18px"><section class="card" style="padding:20px"><h2 style="font-size:17px;margin-top:0">Gráfica de ingresos</h2>${financeChart(r.buckets,'income')}</section><section class="card" style="padding:20px"><h2 style="font-size:17px;margin-top:0">Gráfica de egresos</h2>${financeChart(r.buckets,'expense')}</section></div><section class="card" style="padding:20px;margin-bottom:18px"><h2 style="font-size:17px;margin-top:0">Gastos por categoría</h2>${financeCategoryChart(r.categories)}</section>`}
function financeTransactionsTable(movements,actions=true){return `<div class="table-scroll" tabindex="0" role="region" aria-label="Tabla desplazable horizontalmente"><table><thead><tr><th>Fecha</th><th>Tipo</th><th>Residencial</th><th>Categoría / concepto</th><th>Cliente / beneficiario</th><th>Método / referencia</th><th>Monto</th><th>Estado${actions?' / acciones':''}</th></tr></thead><tbody>${movements.map(e=>`<tr style="${e.voidedAt?'opacity:.55;':''}"><td>${fmtDate(e.date)}</td><td>${e.kind==='expense'?'Egreso':'Ingreso'}</td><td>${esc(financeResidenceName(e.residenceId))}</td><td><strong>${esc(e.category)}</strong><br><small>${esc(e.description)}</small></td><td>${esc(e.payee||'—')}</td><td>${esc(e.method||'—')}<br><small>${esc(e.reference||'')}</small></td><td style="font-weight:750;color:${e.kind==='expense'?'#bd3742':'#087a5b'}">${money(e.amount)}</td><td>${e.voidedAt?'Anulado':'Registrado'}${actions?e.source==='receipt'?`<br><button class="btn btn-outline btn-sm" data-action="receipt-preview" data-id="${esc(e.paymentId)}">Ver recibo</button>`:e.voidedAt?`<br><button class="btn btn-soft btn-sm" data-action="finance-restore" data-id="${esc(e.id)}">Restaurar</button>`:`<div style="display:flex;gap:6px;margin-top:5px"><button class="btn btn-outline btn-sm" data-action="finance-edit" data-id="${esc(e.id)}">Editar</button><button class="btn btn-danger btn-sm" data-action="finance-void" data-id="${esc(e.id)}">Anular</button></div>`:''}</td></tr>`).join('')}</tbody></table>${!movements.length?'<div class="empty">No hay movimientos para este período y residencial.</div>':''}</div>`}
function financePage(){let r=financeReport(),movements=r.movements.filter(e=>financeShowVoided||!e.voidedAt);return `${header('Finanzas y utilidad','Controla tus cobros, gastos y resultado de caja en lempiras.', '<button class="btn btn-primary" data-action="finance-expense">+ Registrar gasto</button><button class="btn btn-outline" data-action="finance-income">+ Otro ingreso</button><button class="btn btn-outline" data-action="finance-print">Reporte con gráficas / PDF</button><button class="btn btn-outline" data-action="finance-csv">Descargar CSV</button>')}${financeFilters()}<p class="sm muted">${esc(r.label)} · Del ${fmtDate(r.from)} al ${fmtDate(r.to)} · ${financeFilter.residenceId==='all'?'Todas las residenciales y gastos generales':esc(financeResidenceName(financeFilter.residenceId))}</p>${financeKpis(r)}<div class="notice-card" style="margin-bottom:18px">La utilidad de caja es lo recibido menos lo pagado. Los ingresos de ventas incluyen automáticamente primas, abonos y pagos al contado registrados; los saldos por cobrar y las reservas sin pago no suman ingresos. Registra también costos de terrenos, maquinaria y demás gastos para reflejar el resultado completo. Los gastos generales se incluyen al consultar todas las residenciales.</div>${financeCharts(r)}<section class="card"><div class="panel-table-head"><h2>Movimientos del período</h2><label class="sm"><input type="checkbox" id="finance-show-voided" ${financeShowVoided?'checked':''}> Mostrar anulados</label></div>${financeTransactionsTable(movements)}</section>`}
function financeDashboard(){let r=financeReport({...financeFilter,residenceId:residence().id});return `<section style="margin:0 0 22px"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px"><div><h2 style="font-size:20px;margin:0">Ganancias y gastos · ${esc(r.label)}</h2><p class="sm muted">Utilidad de caja de ${esc(residence().name)}. Consulta los gastos generales en Finanzas → Todas las residenciales.</p></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-outline" data-action="finance-open-current">Ver finanzas y gráficas</button><button class="btn btn-primary" data-action="finance-expense" data-residence="${esc(residence().id)}">Registrar gasto</button></div></div>${financeFilters(false)}${financeKpis(r)}</section>`}
function financeEntryForm(kind,id=null,defaultResidence=null){let e=id?(db.cashEntries||[]).find(e=>e.id===id):null;if(id&&!e)return;if(e?.voidedAt){toast('Restaura el movimiento antes de editarlo.','error');return}if(e)kind=e.kind;let rid=e?.residenceId||(defaultResidence|| (financeFilter.residenceId==='all'?'general':financeFilter.residenceId));showModal(e?'Editar '+(kind==='expense'?'gasto':'ingreso'):kind==='expense'?'Registrar gasto':'Registrar otro ingreso',`<form id="finance-entry-form"><input name="entryId" type="hidden" value="${esc(e?.id||'')}"><input name="kind" type="hidden" value="${kind}"><div class="form-grid">${field('Fecha del movimiento','date',e?.date||businessToday(),{type:'date',required:true})}${field('Monto (L.)','amount',e?.amount??'',{type:'number',min:'.01',step:'.01',required:true})}<div class="field-group full"><label for="finance-entry-residence">Residencial o gasto general</label><select name="residenceId" id="finance-entry-residence" required><option value="general" ${rid==='general'?'selected':''}>General / compartido</option>${db.residences.map(r=>`<option value="${esc(r.id)}" ${rid===r.id?'selected':''}>${esc(r.name)}</option>`).join('')}</select></div><div class="field-group full"><label for="finance-entry-category">Categoría</label><select name="category" id="finance-entry-category">${financeCategories(kind).map(c=>`<option value="${esc(c)}" ${e?.category===c?'selected':''}>${esc(c)}</option>`).join('')}<option value="__new__">+ Agregar categoría</option></select></div><div class="field-group full hidden" id="finance-new-category"><label for="finance-category-name">Nombre de la nueva categoría</label><input id="finance-category-name" name="newCategory" maxlength="60"></div>${field('Concepto / detalle','description',e?.description||'',{full:true,required:true,extra:'maxlength="300"'})}${field(kind==='expense'?'Beneficiario / proveedor':'Recibido de','payee',e?.payee||'',{extra:'maxlength="150"'})}<div class="field-group"><label for="finance-entry-method">Método de pago</label><select name="method" id="finance-entry-method">${['Efectivo','Transferencia','Depósito','Tarjeta','Otro'].map(v=>`<option ${e?.method===v?'selected':''}>${v}</option>`).join('')}</select></div>${field('N.º de comprobante / referencia','reference',e?.reference||'',{full:true,extra:'maxlength="100"'})}</div>${kind==='income'?'<p class="sm muted">Registra aquí solo ingresos que no estén ya en ventas o cuotas, para evitar contarlos dos veces.</p>':''}<p id="finance-entry-error" role="alert" style="color:#bd3742"></p></form>`,`<button class="btn btn-soft" data-action="close-modal">Cancelar</button><button class="btn btn-primary" form="finance-entry-form" type="submit">${e?'Guardar cambios':kind==='expense'?'Guardar gasto':'Guardar ingreso'}</button>`,true)}
function commitFinanceEntry(data){let kind=String(data.kind||''),old=data.entryId?(db.cashEntries||[]).find(e=>e.id===data.entryId):null;if(!['expense','income'].includes(kind)||data.entryId&&!old||old&&old.kind!==kind||old?.voidedAt)throw Error('Movimiento no válido para editar.');let date=String(data.date||''),n=Number(data.amount),cents=Math.round(n*100),rid=String(data.residenceId||''),category=String(data.category==='__new__'?data.newCategory:data.category||'').trim().replace(/\s+/g,' '),description=String(data.description||'').trim(),payee=String(data.payee||'').trim(),reference=String(data.reference||'').trim(),method=String(data.method||'');if(!validSolarDate(date))throw Error('Selecciona una fecha válida.');if(!Number.isFinite(n)||n<=0||!Number.isSafeInteger(cents)||Math.abs(cents/100-n)>.000001)throw Error('Escribe un monto mayor que cero y con hasta dos decimales.');if(rid!=='general'&&!db.residences.some(r=>r.id===rid))throw Error('Selecciona una residencial válida.');if(!category||category.length>60||!description||description.length>300||payee.length>150||reference.length>100||!['Efectivo','Transferencia','Depósito','Tarjeta','Otro'].includes(method))throw Error('Revisa la categoría, el concepto y los datos del movimiento.');let record={id:old?.id||uid(kind==='expense'?'G':'I')+'-'+Date.now().toString(36),kind,date,amount:cents/100,residenceId:rid,category,description,payee,reference,method,createdAt:old?.createdAt||new Date().toISOString(),updatedAt:new Date().toISOString(),voidedAt:null};db.cashEntries??=[];if(old){record.history=[...(old.history||[]),{date:old.date,amount:old.amount,residenceId:old.residenceId,category:old.category,description:old.description,payee:old.payee,reference:old.reference,method:old.method,changedAt:record.updatedAt}];Object.assign(old,record)}else db.cashEntries.push(record);db.cashCategories??={};db.cashCategories[kind]=[...new Set([...(db.cashCategories[kind]||[]),category])];return record}
function persistFinanceEntry(data){let snapshot=JSON.stringify(db);try{let e=commitFinanceEntry(data);localStorage.setItem(STORAGE,JSON.stringify(db));return e}catch(e){db=JSON.parse(snapshot);throw e}}
function financeVoid(id,restore=false){let e=(db.cashEntries||[]).find(e=>e.id===id);if(!e)return;let snapshot=JSON.stringify(db);try{e.voidedAt=restore?null:new Date().toISOString();e.updatedAt=new Date().toISOString();localStorage.setItem(STORAGE,JSON.stringify(db));render();toast(restore?'Movimiento restaurado':'Movimiento anulado. Puedes restaurarlo mostrando los anulados.')}catch(err){db=JSON.parse(snapshot);toast('No se pudo guardar el cambio.','error')}}
function financeCsv(){let r=financeReport(),rows=[['Reporte financiero',r.label],['Desde',r.from,'Hasta',r.to],['Residencial',financeFilter.residenceId==='all'?'Todas':financeResidenceName(financeFilter.residenceId)],[],['Fecha','Tipo','Residencial','Categoría','Concepto','Cliente / beneficiario','Método','Referencia','Monto (L.)'],...r.active.map(e=>[e.date,e.kind==='expense'?'Egreso':'Ingreso',financeResidenceName(e.residenceId),e.category,e.description,e.payee||'',e.method||'',e.reference||'',e.amount]),[],['Total ingresos',r.income],['Total egresos',r.expense],['Utilidad de caja',r.utility]],cell=v=>{let s=String(v??'');if(typeof v!=='number'&&/^\s*[=+@-]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'};download('Finanzas-'+r.from+'-'+r.to+'.csv','\ufeff'+rows.map(row=>row.map(cell).join(',')).join('\r\n'),'text/csv;charset=utf-8')}
function financePrintHtml(r=financeReport()){return `<!doctype html><html lang="es"><meta charset="utf-8"><title>Reporte financiero</title><style>body{font:12px Arial;color:#153449;margin:25px}h1{font-size:22px}h2{font-size:16px}.cards-four,.grid-two{display:grid;grid-template-columns:1fr 1fr;gap:15px}.card{border:1px solid #dce5e9;border-radius:8px;padding:12px!important;break-inside:avoid}.cards-four{margin-bottom:18px}.sm,.muted{font-size:11px;color:#617989}table{width:100%;border-collapse:collapse;font-size:10px}th,td{border:1px solid #dce5e9;padding:5px;text-align:left}thead{display:table-header-group}tr{break-inside:avoid}.table-scroll{overflow:visible}svg{max-width:100%}.detail-line{display:flex;justify-content:space-between}@page{size:A4 landscape;margin:12mm}*{print-color-adjust:exact;-webkit-print-color-adjust:exact}</style><h1>${esc(db.company.name)} · Finanzas y utilidad</h1><p>${esc(r.label)} · ${fmtDate(r.from)} al ${fmtDate(r.to)} · ${financeFilter.residenceId==='all'?'Todas las residenciales y gastos generales':esc(financeResidenceName(financeFilter.residenceId))}</p>${financeKpis(r)}<p>Utilidad de caja = cobros recibidos + otros ingresos − egresos pagados. Los saldos por cobrar y las reservas sin pago no son ingresos. Registra el costo de los terrenos y los demás egresos para reflejar el resultado completo.</p>${financeCharts(r)}<h2>Detalle de gastos por categoría</h2><table><thead><tr><th>Categoría</th><th>Total (L.)</th></tr></thead><tbody>${r.categories.map(c=>`<tr><td>${esc(c.name)}</td><td>${money(c.amount)}</td></tr>`).join('')||'<tr><td colspan="2">Sin gastos registrados</td></tr>'}</tbody></table><h2>Movimientos del período</h2>${financeTransactionsTable(r.active,false)}<p>Emitido el ${fmtDate(businessToday())}. Los movimientos anulados se excluyen del cálculo.</p></html>`}
function financePrint(){let win=window.open('','_blank');if(!win){toast('Permite abrir el reporte para imprimirlo o guardarlo como PDF.','error');return}win.document.write(financePrintHtml());win.document.close();setTimeout(()=>win.print(),400)}
document.addEventListener('change',e=>{if(e.target.matches('[data-finance-filter]')){let k=e.target.dataset.financeFilter,v=['year','month','quarter'].includes(k)?Number(e.target.value):e.target.value,old={...financeFilter};financeFilter[k]=v;try{financePeriod();render()}catch(err){financeFilter=old;toast(err.message,'error');render()}}if(e.target.id==='finance-show-voided'){financeShowVoided=e.target.checked;render()}if(e.target.id==='finance-entry-category'){let isNew=e.target.value==='__new__';$('#finance-new-category').classList.toggle('hidden',!isNew);$('#finance-category-name').required=isNew}});
document.addEventListener('submit',e=>{if(e.target.id!=='finance-entry-form')return;e.preventDefault();try{persistFinanceEntry(Object.fromEntries(new FormData(e.target).entries()));closeModal();render();toast('Movimiento guardado')}catch(err){let el=$('#finance-entry-error');if(el)el.textContent=err.message||'No se pudo guardar el movimiento.'}});

ensureResidences();
if(db.company?.name==='Lotificación Los Pinos'){db.company.name='Lotificadora Henríquez';save()}
const adaptiveStyle=document.querySelector('link[href="responsive.css"]');document.head.append(adaptiveStyle);
window.matchMedia('(max-width:1024px)').addEventListener('change',()=>{mobileOpen=false;render()});
window.addEventListener('resize',()=>{if(geoMap)geoMap.invalidateSize()});
let hasStored=false;try{hasStored=!!localStorage.getItem(STORAGE)}catch(e){}if(!hasStored)save();render();setTimeout(refreshClientRequests,500);
})();

:root{--navy:#10291b;--navy-2:#143822;--deep:#081d12;--green:#3baf45;--green-dark:#238535;--green-soft:#ecf8e8;--sky:#429b78;--sky-soft:#e8f7ec;--ink:#1d3728;--muted:#788b7c;--line:#dfe8df;--canvas:#f5f8f5;--lime:#b9f600}

/* Login, ligeramente iluminado y sin efectos que degraden el rendimiento */
.login-page,.login-page[data-login-theme=natural],.login-page[data-login-theme=dark],.login-page[data-login-theme=light]{min-height:100svh;display:grid;grid-template-columns:minmax(0,1fr) minmax(340px,450px);align-items:center;gap:clamp(24px,5vw,78px);padding:clamp(20px,4vw,56px) clamp(22px,7vw,110px) 86px;position:relative;isolation:isolate;overflow:hidden;background:radial-gradient(circle at 20% 22%,#355d373b,transparent 37%),linear-gradient(132deg,#0a1a11,#152d20 52%,#081710)!important;color:white!important}

 document.addEventListener('click',function(e){
   const btn=e.target.closest('[data-lg-action]');
   if(btn){const action=btn.dataset.lgAction;
      if(action==='pin'){const next=localStorage.getItem('lotigest-v08-pin')!=='true';localStorage.setItem('lotigest-v08-pin',String(next));byId('lgSidebar')?.classList.toggle('pinned',next);btn.textContent=next?'◆':'♧';}
      if(action==='theme'){const next=!document.body.classList.contains('lotigest-dark');document.body.classList.toggle('lotigest-dark',next);localStorage.setItem('lotigest-v08-theme',next?'dark':'light');btn.textContent=next?'☀':'◐';}
      if(action==='notifications'||action==='user'){
        const target=byId(action==='notifications'?'lgNotifications':'lgUserPopup');const other=byId(action==='notifications'?'lgUserPopup':'lgNotifications');if(other)other.hidden=true;if(target)target.hidden=!target.hidden;
      }
      e.stopPropagation();return;
   }
   if(!e.target.closest('.lg-popup-parent')&&!e.target.closest('.lg-search')){
      for(const id of ['lgNotifications','lgUserPopup','lgSearchResults']){let el=byId(id);if(el)el.hidden=true}
   }
 });
 document.addEventListener('input',e=>{if(e.target.id!=='lgModuleSearch')return;
  const results=byId('lgSearchResults'),q=e.target.value.trim().toLocaleLowerCase('es');if(!results)return;
  results.replaceChildren();if(!q){results.hidden=true;return}
  document.querySelectorAll('.lg-nav [data-page]').forEach(btn=>{if(!btn.getAttribute('title').toLocaleLowerCase('es').includes(q))return;const b=document.createElement('button');b.textContent=btn.getAttribute('title');b.addEventListener('click',()=>{btn.click()});results.append(b)});results.hidden=false;
 });
 document.addEventListener('keydown',e=>{if(e.key==='Escape'){for(const id of ['lgNotifications','lgUserPopup','lgSearchResults']){let el=byId(id);if(el)el.hidden=true}}});
})();
</script>

<div id="lgUpdateNotice" role="status" aria-live="polite" aria-label="Actualización de LOTIGEST disponible" hidden>
 <div class="lg-up-head"><span class="lg-up-icon" aria-hidden="true">↻</span><div><strong>Nueva actualización disponible</strong><p id="lgUpdateVersion">LOTIGEST tiene mejoras listas para instalar.</p></div></div>
 <div class="lg-up-actions"><button type="button" class="lg-update-later" id="lgUpdateLater">Más tarde</button><button type="button" class="lg-update-now" id="lgUpdateNow">Actualizar ahora</button></div>
</div>

<script id="lotigest-update-checker">
/* LOTIGEST v0.10 · Revisión de nuevas versiones en GitHub Pages.
   Para cada nueva publicación: actualizar el archivo version.json DESPUÉS del HTML. */
(()=>{'use strict';
 const CURRENT_VERSION='0.10.0';
 const MANIFEST='version.json';
 const CHECK_MS=120000;
 const STORAGE_KEY='lg-update-dismissed-v1';
 const byId=id=>document.getElementById(id);
 let latest=null, checking=false;
 const notice=byId('lgUpdateNotice');
 const safelyGetDismissed=()=>{try{return sessionStorage.getItem(STORAGE_KEY)}catch{return null}};
 const safelyDismiss=version=>{try{sessionStorage.setItem(STORAGE_KEY,version)}catch{}};
 const show=version=>{
   if(!notice||version===CURRENT_VERSION||version===safelyGetDismissed())return;
   latest=version;
   const target=byId('lgUpdateVersion');if(target)target.textContent='Versión '+version+' disponible';
   notice.hidden=false;
 };
 async function check(){
   if(checking||document.visibilityState==='hidden'||!navigator.onLine)return;
   checking=true;
   try{
     const url=new URL(MANIFEST,document.baseURI);
     url.searchParams.set('_',String(Date.now()));
     const response=await fetch(url.toString(),{cache:'no-store'});
     if(!response.ok)return;
     const info=await response.json();
     if(typeof info.version==='string'&&/^\d+\.\d+\.\d+$/.test(info.version)&&info.version!==CURRENT_VERSION)show(info.version);
   }catch(_){/* sin conexión: no interrumpir la aplicación */}
   finally{checking=false}
 }
 byId('lgUpdateLater')?.addEventListener('click',()=>{if(latest)safelyDismiss(latest);notice.hidden=true});
 byId('lgUpdateNow')?.addEventListener('click',()=>{
   if(!confirm('Se actualizará LOTIGEST. Guarda cualquier formulario que estés editando antes de continuar. ¿Actualizar ahora?'))return;
   const url=new URL(location.href);url.searchParams.set('v',latest||String(Date.now()));
   location.assign(url.toString());
 });
 window.addEventListener('focus',check);
 document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')check()});
 window.addEventListener('online',check);
 setInterval(check,CHECK_MS);
 setTimeout(check,3500);
})();
</script>
